# Self-hosted DocuSeal — the open-source DocuSign replacement.
#
# This file is consumed by `fly deploy --config infra/docuseal/fly.toml` to
# provision a single-region (bom — Mumbai) DocuSeal instance that backs the
# Onboarding v2 LOI signing flow. The FastAPI side talks to it via
# DOCUSEAL_BASE_URL (https://sign.nirnayaiq.com) and receives webhooks at
# /docuseal/webhook signed with the shared WEBHOOK_SECRET.
#
# Pin a specific image tag — :latest in prod has been the source of more
# than one painful 03:00 Sunday incident across the industry. Update the
# tag intentionally, behind a manual review.

app = "nirnayaiq-docuseal"
primary_region = "bom"

[build]
  image = "docuseal/docuseal:1.10"

[env]
  # Public hostname — DocuSeal generates absolute URLs (embed_src, signed
  # PDF links, signing emails) using HOST. Must match the Fly cert below.
  HOST = "sign.nirnayaiq.com"
  FORCE_SSL = "true"
  RAILS_ENV = "production"
  RAILS_LOG_TO_STDOUT = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Signing latency is user-visible — don't let machines cold-start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/up"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"

# Persistent volume holds uploaded template assets, the SQLite cache, and
# any binary attachments DocuSeal keeps locally. Signed PDFs are also
# re-archived to Supabase Storage by our app, so this volume is not the
# sole source of truth for completed envelopes.
[[mounts]]
  source = "docuseal_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB headroom for Rails + image PDF processing. 512 MB is too tight
  # under upload bursts (the Rails boot alone uses ~300 MB).
  memory = "1gb"

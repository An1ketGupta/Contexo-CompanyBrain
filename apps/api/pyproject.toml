[project]
name = "api"
version = "0.1.0"
description = "NirnayaIQ — FastAPI AI backend"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.136.3",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "inngest>=0.5.18",
    "langchain-text-splitters>=0.3",
    "langfuse>=3.0.0,<4",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "sentry-sdk[fastapi]>=2.20.0",
    "structlog>=24.4.0",
    "supabase>=2.31.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

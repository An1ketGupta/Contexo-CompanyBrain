[project]
name = "api"
version = "0.1.0"
description = "Company Brain — FastAPI AI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "google-generativeai>=0.8",
    "httpx>=0.28.1",
    "inngest>=0.5.18",
    "langchain-text-splitters>=0.3",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
]

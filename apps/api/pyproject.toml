[project]
name = "api"
version = "0.1.0"
description = "NirnayaIQ — FastAPI AI backend"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.136.3",
    "google-genai>=2.8.0",
    "httpx>=0.28.1",
    "inngest>=0.5.18",
    "langchain-text-splitters>=0.3",
    "langfuse>=3.0.0,<4",
    "lxml>=5.3.0",
    "markdown>=3.7",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.9.0",
    "pymupdf>=1.27.2.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "sentry-sdk[fastapi]>=2.20.0",
    "stripe>=11.4.0",
    "structlog>=24.4.0",
    "supabase>=2.31.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live Supabase + Gemini API (excluded from default run)",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["__pycache__", ".venv", "alembic"]

[tool.ruff.lint]
# Pre-launch posture: gate CI only on real bug-finders. Style rules (B/SIM/UP)
# are left to author discretion so review doesn't get stuck on taste. Tighten
# this list post-launch once the team has cycles for a single cleanup pass.
select = [
    "E",   # pycodestyle errors (real syntax/indent issues)
    "F",   # pyflakes — unused imports, undefined names, redefinitions
    "I",   # isort — auto-fixable, so safe to gate on
]
ignore = [
    "E501",  # line length is enforced by formatter, not lint
    "E402",  # module-level imports below code: some bootstraps need this
    "E741",  # single-letter variable names: tolerated in math-y code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]  # fixtures often appear unused but are imported for side effects

name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same PR/branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: API · pytest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      # Stub values that satisfy startup config validation without hitting
      # any real provider. Tests that mock out these clients don't care
      # about the literal value, only that it's truthy.
      ENVIRONMENT: test
      GEMINI_API_KEY: test-placeholder-gemini-key
      OAUTH_STATE_SECRET: test-placeholder-oauth-secret-must-be-long-enough-aaaaaaaa
      INNGEST_SIGNING_KEY: signkey-test-placeholder
      INNGEST_EVENT_KEY: evkey-test-placeholder
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder.anon.key
      SUPABASE_SERVICE_ROLE_KEY: placeholder.service.role.key
      INTERNAL_EMAIL_SECRET: test-placeholder-internal-email-secret
      RESEND_API_KEY: re_test_placeholder
      EMAIL_FROM: ci@example.com
      APP_URL: http://localhost:3000
      LLM_PROVIDER: gemini
      EMBEDDING_PROVIDER: google
      EMBEDDING_DIMENSIONS: "768"
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder-redis-token
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.7.x"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        # Catches real bug-finders only (F/E/I). Style is intentionally not
        # gated — see [tool.ruff.lint] in pyproject.toml for the rationale.
        run: uv run ruff check .

      - name: Run unit tests
        # The default pytest config already excludes `integration` via addopts,
        # but we set --maxfail explicitly so CI fails fast on cascading errors
        # instead of timing out.
        run: uv run pytest --maxfail=10 -q

  frontend-checks:
    name: Web · typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      # Build needs publishable env vars to satisfy Next's static analysis.
      # These are placeholders — no real services are contacted at build.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder.anon.key
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # Skip Sentry in CI (the SDK auto-detects env vars and would warn)
      SENTRY_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build
